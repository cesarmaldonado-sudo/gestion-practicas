/* ---- PDF generation core ---- */
function addLetterhead(pdf, cfg, title, subtitle){
  const pw = pdf.internal.pageSize.getWidth();
  if(cfg.logoBase64){ try{ pdf.addImage(cfg.logoBase64,'PNG',15,10,20,20); }catch(e){} }
  pdf.setFont('helvetica','bold'); pdf.setFontSize(11); pdf.setTextColor(22,33,62);
  pdf.text(cfg.nombreInstitucion||'Institución', pw-15, 15, {align:'right'});
  pdf.setFont('helvetica','normal'); pdf.setFontSize(8); pdf.setTextColor(110,110,110);
  pdf.text(cfg.direccion||'', pw-15, 20, {align:'right'});
  pdf.text([cfg.telefono,cfg.correo].filter(Boolean).join('  ·  '), pw-15, 24, {align:'right'});
  if(cfg.rbd) pdf.text('RBD: '+cfg.rbd, pw-15, 28, {align:'right'});
  pdf.setDrawColor(183,134,43); pdf.setLineWidth(0.9); pdf.line(15,30,pw-15,30);
  pdf.setFont('times','bold'); pdf.setFontSize(15); pdf.setTextColor(22,33,62);
  pdf.text(title, pw/2, 40, {align:'center'});
  if(subtitle){ pdf.setFont('helvetica','normal'); pdf.setFontSize(9); pdf.setTextColor(120,120,120); pdf.text(subtitle, pw/2, 46, {align:'center'}); }
  return subtitle? 55: 50;
}
function savePDF(pdf, filename){
  // Abre el PDF en una pestaña nueva (con su propio visor, botón de descarga y X para cerrar).
  // Esto es más confiable que pdf.save() cuando la app corre desde un archivo local (file://),
  // donde Chrome suele bloquear las descargas automáticas sin avisar.
  try{
    const blobUrl = pdf.output('bloburl');
    const w = window.open(blobUrl, '_blank');
    if(!w){ pdf.save(filename); } // si el navegador bloqueó la pestaña emergente, intenta la descarga directa
  }catch(e){
    console.error('savePDF error', e);
    pdf.save(filename);
  }
}
function addFooterAll(pdf){
  const n = pdf.internal.getNumberOfPages();
  for(let i=1;i<=n;i++){ pdf.setPage(i); const w=pdf.internal.pageSize.getWidth(), h=pdf.internal.pageSize.getHeight();
    pdf.setFontSize(7); pdf.setTextColor(160,160,160);
    pdf.text('Documento generado automáticamente por el sistema de gestión de prácticas · Página '+i+' de '+n, w/2, h-8, {align:'center'});
  }
}
function addChartImage(pdf, img, x, y, w, h){
  if(img){
    pdf.addImage(img,'PNG',x,y,w,h);
    return y + h + 10;
  }
  pdf.setDrawColor(220,220,220); pdf.setFillColor(248,248,248);
  pdf.roundedRect(x,y,w,40,2,2,'FD');
  pdf.setFont('helvetica','normal'); pdf.setFontSize(8.5); pdf.setTextColor(140,140,140);
  pdf.text('Gráfico no disponible (la librería de gráficos no pudo cargarse en este navegador).', x+w/2, y+20, {align:'center'});
  return y + 40 + 10;
}

/* ---- Informe profesional de indicadores (con gráficos) ---- */
function renderOffscreenChart(type, data, extra, w, h){
  return new Promise(resolve=>{
    if(typeof Chart==='undefined'){ resolve(null); return; } // Chart.js no cargó (posible bloqueador de anuncios): seguimos sin el gráfico
    const host = document.createElement('div');
    host.style.cssText = `position:absolute;left:-9999px;top:0;width:${w}px;height:${h}px;`;
    const canvas = document.createElement('canvas');
    canvas.width = w; canvas.height = h;
    host.appendChild(canvas); document.body.appendChild(host);
    const chart = new Chart(canvas, {type, data, options:Object.assign({responsive:false, animation:false, plugins:{legend:{labels:{font:{family:"'IBM Plex Sans'",size:12}}}}, scales: type==='doughnut'?{}:{ y:{beginAtZero:true, ticks:{font:{size:11}}}, x:{ticks:{font:{size:11}}}}}, extra||{})});
    requestAnimationFrame(()=>requestAnimationFrame(()=>{
      const img = canvas.toDataURL('image/png');
      chart.destroy(); document.body.removeChild(host);
      resolve(img);
    }));
  });
}
async function generarInformePDF(){
  toast('Generando informe…');
  const list = students(); const cfg = config();
  const notas = list.filter(s=>s.evaluacionDocente).map(s=>s.evaluacionDocente.nota);
  const promEval = notas.length? (notas.reduce((a,b)=>a+b,0)/notas.length).toFixed(2) : '—';
  const horas = list.reduce((a,s)=>a+(Number(s.horasRealizadas)||0),0);
  const finalizadas = list.filter(s=>s.estado==='Finalizada'||s.estado==='Cerrada');
  const carreras = uniqueVals('carrera');

  const imgCarreras = await renderOffscreenChart('bar', {labels:carreras, datasets:[{label:'Estudiantes', data:carreras.map(c=>list.filter(s=>s.carrera===c).length), backgroundColor:'#16213E', borderRadius:4}]}, {}, 700, 340);
  const imgHoras = await renderOffscreenChart('bar', {labels:list.map(s=>s.nombre.split(' ')[0]), datasets:[
      {label:'Requeridas', data:list.map(s=>s.horasRequeridas), backgroundColor:'#DDDFDA', borderRadius:4},
      {label:'Realizadas', data:list.map(s=>s.horasRealizadas), backgroundColor:'#16213E', borderRadius:4}]}, {}, 700, 340);
  const imgEstados = await renderOffscreenChart('doughnut', {labels:ESTADOS, datasets:[{data:ESTADOS.map(e=>list.filter(s=>s.estado===e).length), backgroundColor:['#88909A','#2C5F8A','#16213E','#9C6B12','#7A2E3B','#2F6F4E','#B7862B']}]}, {}, 700, 340);
  const withEval = list.filter(s=>s.evaluacionDocente);
  const imgEval = withEval.length? await renderOffscreenChart('bar', {labels:withEval.map(s=>s.nombre.split(' ')[0]), datasets:[{label:'Nota (1-7)', data:withEval.map(s=>s.evaluacionDocente.nota), backgroundColor:'#B7862B', borderRadius:4}]}, {scales:{y:{beginAtZero:true,max:7}}}, 700, 340) : null;

  const jsPDF = collectPDFmakerLib();
  const pdf = new jsPDF({unit:'mm', format:'a4'});
  const pw = pdf.internal.pageSize.getWidth();
  let y = addLetterhead(pdf, cfg, 'Informe de Indicadores de Prácticas Profesionales', 'Generado el '+new Date().toLocaleDateString('es-CL')+' · '+list.length+' estudiantes en el proceso');

  sectionTitle(pdf,15,y,'Resumen ejecutivo'); y+=8;
  pdf.autoTable({ startY:y, margin:{left:15,right:15}, styles:{fontSize:9.5}, headStyles:{fillColor:[22,33,62]}, theme:'grid',
    head:[['Indicador','Valor']],
    body:[
      ['Total de estudiantes en proceso', String(list.length)],
      ['Promedio evaluación docente (escala 1-7)', String(promEval)],
      ['Horas de práctica registradas', horas.toLocaleString('es-CL')],
      ['Prácticas finalizadas', String(finalizadas.length)+' de '+list.length],
    ] });
  y = pdf.lastAutoTable.finalY + 12;

  y = checkPageBreak(pdf,y,cfg);
  const chartH = (pw-30)*340/700;
  y = checkPageBreakForBlock(pdf,y,cfg,6+chartH);
  sectionTitle(pdf,15,y,'Estudiantes por especialidad'); y+=6;
  y = addChartImage(pdf, imgCarreras, 15, y, pw-30, chartH);

  y = checkPageBreakForBlock(pdf,y,cfg,6+chartH);
  sectionTitle(pdf,15,y,'Estado de las prácticas'); y+=6;
  y = addChartImage(pdf, imgEstados, 15, y, pw-30, chartH);

  pdf.addPage(); y = 20;
  sectionTitle(pdf,15,y,'Horas realizadas vs. requeridas por estudiante'); y+=6;
  y = addChartImage(pdf, imgHoras, 15, y, pw-30, chartH);

  if(imgEval){
    y = checkPageBreakForBlock(pdf,y,cfg,6+chartH);
    sectionTitle(pdf,15,y,'Evaluación docente por estudiante'); y+=6;
    y = addChartImage(pdf, imgEval, 15, y, pw-30, chartH);
  }

  pdf.addPage(); y = 20;
  sectionTitle(pdf,15,y,'Detalle por estudiante'); y+=8;
  pdf.autoTable({ startY:y, margin:{left:15,right:15}, styles:{fontSize:8}, headStyles:{fillColor:[22,33,62]},
    head:[['Estudiante','Especialidad','Empresa','Horas','Nota','Estado']],
    body: list.map(s=>[s.nombre, s.carrera||'—', s.empresa||'—', `${s.horasRealizadas}/${s.horasRequeridas}`, s.evaluacionDocente?s.evaluacionDocente.nota:'—', s.estado]) });

  addFooterAll(pdf);
  savePDF(pdf, `Informe_Indicadores_Practicas_${new Date().toISOString().slice(0,10)}.pdf`);
  toast('Informe generado');
}
function sectionTitle(pdf,x,y,text){
  pdf.setFillColor(22,33,62); pdf.rect(x,y-3.6,2.6,4.2,'F');
  pdf.setFont('helvetica','bold'); pdf.setFontSize(10); pdf.setTextColor(22,33,62);
  pdf.text(text.toUpperCase(), x+5, y);
}
function fieldRow(pdf,x,y,label,value){
  pdf.setFont('helvetica','bold'); pdf.setFontSize(8); pdf.setTextColor(120,120,120);
  pdf.text(label.toUpperCase(), x, y);
  pdf.setFont('helvetica','normal'); pdf.setFontSize(10); pdf.setTextColor(25,25,25);
  const txt = (value===undefined||value===null||value==='')? '—' : String(value);
  pdf.text(pdf.splitTextToSize(txt, 82), x, y+5);
}
function addFieldGrid(pdf, y0, fields, pageWidth){
  const margin=15, colW=(pageWidth-margin*2)/2; let y=y0, col=0;
  fields.forEach(f=>{ fieldRow(pdf, margin+col*colW, y, f.label, f.value); col++; if(col>1){col=0;y+=13;} });
  if(col===1) y+=13;
  return y+5;
}
function addSignatures(pdf,y,labels,pageWidth){
  const margin=15, usable=pageWidth-margin*2, colW=usable/labels.length;
  labels.forEach((label,i)=>{ const x=margin+i*colW; pdf.setDrawColor(130,130,130); pdf.line(x+6,y,x+colW-6,y); pdf.setFontSize(8); pdf.setTextColor(90,90,90); pdf.text(label, x+colW/2, y+5, {align:'center'}); });
}
function paragraph(pdf, x, y, text, maxWidth){
  pdf.setFont('helvetica','normal'); pdf.setFontSize(10); pdf.setTextColor(30,30,30);
  const lines = pdf.splitTextToSize(text||'—', maxWidth);
  pdf.text(lines, x, y);
  return y + lines.length*5;
}
function checkPageBreak(pdf, y, cfg, limit=270){ if(y>limit){ pdf.addPage(); return 20; } return y; }
function checkPageBreakForBlock(pdf, y, cfg, blockHeight, limit=270){ if(y+blockHeight>limit){ pdf.addPage(); return 20; } return y; }

function buildDocContent(pdf, key, s, cfg, y, pw){
  switch(key){

async function generateDocPDF(sid, docKey, silent){
  const s = getStudent(sid); const cfg = config();
  if(!silent) toast('Generando documento…');
  const jsPDF = collectPDFmakerLib(); const pdf = new jsPDF({unit:'mm',format:'a4'});
  const d = DOC_TYPES.find(x=>x.key===docKey);
  const pw = pdf.internal.pageSize.getWidth();
  const y = addLetterhead(pdf, cfg, d.name, s.nombre);
  buildDocContent(pdf, docKey, s, cfg, y, pw);
  addFooterAll(pdf);
  const fname = String(d.n).padStart(2,'0')+'_'+d.name.replace(/[\/\s]+/g,'_')+'.pdf';
  savePDF(pdf, fname);
  s.documentos[docKey].fileName = fname;
  s.documentos[docKey].status = s.documentos[docKey].status==='completo'? 'completo' : 'revision';
  s.documentos[docKey].updatedAt = new Date().toISOString().slice(0,10);
  s.docGenerated = true;
  await saveData();
  if(!silent) toast('PDF generado: '+d.name);
}

async function generateAllDocs(sid){
  for(const d of DOC_TYPES){ await generateDocPDF(sid, d.key, true); }
  toast('Documentación generada (12 documentos)');
  renderView();
  refreshOpenDocsModal(sid);
}

async function downloadExpediente(sid){
  const s = getStudent(sid); const cfg = config();
  toast('Generando expediente…');
  const jsPDF = collectPDFmakerLib(); const pdf = new jsPDF({unit:'mm',format:'a4'});
  DOC_TYPES.forEach((d,i)=>{
    if(i>0) pdf.addPage();
    const pw = pdf.internal.pageSize.getWidth();
    const y = addLetterhead(pdf,cfg,d.name,s.nombre);
    buildDocContent(pdf, d.key, s, cfg, y, pw);
  });
  addFooterAll(pdf);
  savePDF(pdf, 'Expediente_'+s.nombre.replace(/\s+/g,'_')+'.pdf');
  toast('Expediente completo descargado');
}

function fileToBase64(file){ return new Promise((res,rej)=>{ const r=new FileReader(); r.onload=()=>res(r.result); r.onerror=rej; r.readAsDataURL(file); }); }

async function handleUploadDoc(sid, docKey){
  const input = document.createElement('input'); input.type='file'; input.accept='.pdf,.doc,.docx,image/*';
  input.onchange = async ()=>{
    const f = input.files[0]; if(!f) return;
    const s = getStudent(sid);
    s.documentos[docKey].fileName = f.name;
    s.documentos[docKey].status = 'revision';
    s.documentos[docKey].updatedAt = new Date().toISOString().slice(0,10);
    await saveData(); renderView(); refreshOpenDocsModal(sid); toast('Documento cargado: '+f.name+' (pendiente de aprobación)');
  };

async function handleAddEntry(sid, listName){
  const s = getStudent(sid);
  if(listName==='programa'){
    const row = {fecha:val('pr_fecha'), actividad:val('pr_actividad'), area:val('pr_area'), responsable:val('pr_responsable'), horas:Number(val('pr_horas'))||0, observaciones:val('pr_obs')};
    if(!row.fecha && !row.actividad){ toast('Completa al menos fecha y actividad'); return; }
    s.programa.push(row);
  } else if(listName==='asistencia'){
    const row = {fecha:val('as_fecha'), entrada:val('as_entrada'), salida:val('as_salida'), colacion:val('as_colacion'), horas:Number(val('as_horas'))||0};
    if(!row.fecha){ toast('Ingresa la fecha'); return; }
    s.asistencia.push(row);
    s.horasRealizadas = (Number(s.horasRealizadas)||0) + row.horas;
  } else if(listName==='bitacora'){
    const esp = especialidadDe(s);
    if(!esp){ toast('Selecciona una especialidad válida primero'); return; }
    const tareaSel = document.getElementById('bi_tarea');
    const tarea = todasLasTareas(esp).find(t=>t.key===(tareaSel? tareaSel.value:''));
    const row = {fecha:val('bi_fecha'), tareaKey:tarea?tarea.key:'', tareaNum:tarea?tarea.key.replace('_','.'):'', tareaTexto:tarea?tarea.texto:'', seguridad:val('bi_seguridad'), autoeval:val('bi_autoeval'), evalGuia:val('bi_evalguia')};
    if(!row.fecha || !row.tareaKey){ toast('Completa la fecha y selecciona una tarea'); return; }
    s.bitacora.push(row);
  } else if(listName==='seguimiento'){
    const row = {fecha:val('se_fecha'), estado:val('se_estado'), avance:val('se_avance'), observaciones:val('se_obs')};
    if(!row.fecha){ toast('Ingresa la fecha'); return; }
    s.seguimiento.push(row);
  }
  await saveData(); renderView(); toast('Registro agregado');
}

async function handleFinalize(sid){
  const s = getStudent(sid);
  if(!canFinalize(s) && !(isChecklistComplete(s) && s.horasRealizadas>=s.horasRequeridas && s.evaluacionEmpresa && s.evaluacionDocente)){ toast('Aún hay requisitos pendientes'); return; }
  if(!confirm('¿Desea finalizar la práctica de '+s.nombre+'? Esta acción bloqueará la edición de los documentos finales.')) return;
  s.documentos.doc12.status='completo'; s.documentos.doc12.updatedAt=new Date().toISOString().slice(0,10); s.documentos.doc12.fileName='Acta_de_cierre.pdf';
  s.estado = 'Cerrada'; s.fechaCierre = new Date().toISOString().slice(0,10);
  await saveData();
  await downloadExpediente(sid);
  renderView();
  toast('Práctica finalizada. Expediente final generado.');
}

  c.ponderaciones = {empresa:Number(val('cfg_pEmpresa'))||0, profesor:Number(val('cfg_pProfesor'))||0, informe:Number(val('cfg_pInforme'))||0};
  c.escalaAprobacion = Number(val('cfg_escala'))||4.0;
  await saveData(); renderView(); toast('Configuración guardada');
}

function exportCSV(){
  const rows = [['Nombre','RUT','Carrera','Curso','Empresa','Supervisor','Inicio','Término','Horas requeridas','Horas realizadas','Documentos completos','Estado']];
  students().forEach(s=> rows.push([s.nombre,s.rut,s.carrera,s.curso,s.empresa,s.supervisor,s.fechaInicio,s.fechaTermino,s.horasRequeridas,s.horasRealizadas,docsCompletedCount(s)+'/'+DOC_TYPES.length,s.estado]));
  const csv = rows.map(r=>r.map(csvEscape).join(',')).join('\n');
  download(new Blob(['\uFEFF'+csv],{type:'text/csv;charset=utf-8'}), 'listado_estudiantes.csv');
  toast('Listado exportado');
}
function exportReport(type){
  let rows, name;
  if(type==='horas'){ rows=[['Estudiante','Horas requeridas','Horas realizadas','% cumplimiento']]; students().forEach(s=>rows.push([s.nombre,s.horasRequeridas,s.horasRealizadas, s.horasRequeridas? Math.round(s.horasRealizadas/s.horasRequeridas*100)+'%':'—'])); name='reporte_horas.csv'; }
  else if(type==='evaluaciones'){ rows=[['Estudiante','Eval. Empresa','Eval. Docente','Informe','Nota final','Resultado']]; students().forEach(s=>{ const n=(s.evaluacionEmpresa&&s.evaluacionDocente)? weightedNota(s):''; rows.push([s.nombre, s.evaluacionEmpresa?s.evaluacionEmpresa.nota:'', s.evaluacionDocente?s.evaluacionDocente.nota:'', s.informeFinal?s.informeFinal.nota:'', n, n!==''? (n>=config().escalaAprobacion?'Aprobado':'Reprobado'):'']); }); name='reporte_evaluaciones.csv'; }
  else { rows=[['Estudiante','Empresa','Carrera','Fecha de cierre','Resultado']]; students().filter(s=>s.estado==='Cerrada'||s.estado==='Finalizada').forEach(s=>{ const n=(s.evaluacionEmpresa&&s.evaluacionDocente)?weightedNota(s):null; rows.push([s.nombre,s.empresa,s.carrera,s.fechaCierre||'',n!==null?(n>=config().escalaAprobacion?'Aprobado':'Reprobado'):'']); }); name='reporte_finalizadas.csv'; }
  const csv = rows.map(r=>r.map(csvEscape).join(',')).join('\n');
  download(new Blob(['\uFEFF'+csv],{type:'text/csv;charset=utf-8'}), name);
  toast('Reporte exportado');
}

/* ============================================================
   EVENT DELEGATION
   ============================================================ */
document.addEventListener('click', async (e)=>{
  const t = e.target.closest('[data-action]');
  if(!t) return;
  const action = t.dataset.action;
  const id = t.dataset.id;
  try{
  switch(action){
    case 'nav': state.view = t.dataset.view; state.search=''; renderView(); break;
    case 'new-student': openNewStudentModal(); break;
    case 'close-modal': closeModal(); break;
    case 'create-student': await handleCreateStudent(); break;
    case 'open-student': closeModal(); state.view='detalle'; state.selectedId=id; state.detailTab='individualizacion'; renderView(); break;
    case 'open-student-docs': openDocsModal(id); break;
    case 'open-student-tab': state.view='detalle'; state.selectedId=id; state.detailTab=t.dataset.tab; renderView(); break;
    case 'detail-tab': state.detailTab = t.dataset.tab; renderView(); break;
    case 'save-individualizacion': await handleSaveIndividualizacion(id); break;
    case 'generate-all-docs': t.disabled=true; t.textContent='Generando...'; await generateAllDocs(id); break;
    case 'gen-doc': await generateDocPDF(id, t.dataset.doc); renderView(); refreshOpenDocsModal(id); break;
    case 'upload-doc': await handleUploadDoc(id, t.dataset.doc); break;
    case 'doc-status': { const s=getStudent(id); s.documentos[t.dataset.doc].status = t.dataset.status; s.documentos[t.dataset.doc].updatedAt=new Date().toISOString().slice(0,10); await saveData(); renderView(); refreshOpenDocsModal(id); break; }
    case 'download-expediente': await downloadExpediente(id); break;
    case 'add-entry': await handleAddEntry(id, t.dataset.list); break;
    case 'del-entry': await handleDelEntry(id, t.dataset.list, Number(t.dataset.idx)); break;
    case 'save-plan': await handleSavePlan(id); break;
    case 'save-eval-empresa': await handleSaveEvalEmpresa(id); break;
    case 'save-eval-docente': await handleSaveEvalDocente(id); break;
    case 'save-autoeval': await handleSaveAutoeval(id); break;
    case 'save-informe': await handleSaveInforme(id); break;
    case 'finalize-practice': await handleFinalize(id); break;
    case 'delete-student': await handleDeleteStudent(id); break;
    case 'save-config': await handleSaveConfig(); break;
    case 'export-csv': exportCSV(); break;
    case 'export-report': exportReport(t.dataset.report); break;
    case 'stat-detail': openStatDetail(t.dataset.metric); break;
    case 'generar-informe-pdf': await generarInformePDF(); break;
    case 'open-empresa': openEmpresaDetail(decodeURIComponent(t.dataset.empresa)); break;
    case 'generar-informe-empresa': await generarInformeEmpresaPDF(decodeURIComponent(t.dataset.empresa)); break;
    case 'clear-filters': state.filters={carrera:'',estado:'',empresa:''}; renderView(); break;
    case 'doc-filter': state.docFilters.estado = (state.docFilters.estado===t.dataset.estado)? '' : t.dataset.estado; renderView(); break;
    case 'clear-doc-filters': state.docFilters={estado:'',estudiante:''}; renderView(); break;
    case 'toggle-doc-carrera': { const k=t.dataset.key; state.docCollapsed[k] = !state.docCollapsed[k]; renderView(); break; }
    case 'toggle-est-carrera': { const k=t.dataset.key; state.estCollapsed[k] = !state.estCollapsed[k]; renderView(); break; }
    case 'logout': await doLogout(); break;
  }
  }catch(err){
    console.error('Error en acción "'+action+'":', err);
    if(err && err.message==='LIBRERIA_PDF_NO_CARGADA'){
      toast('No se pudo generar el PDF: una librería externa no cargó. Si usas un bloqueador de anuncios (uBlock, AdBlock, etc.), desactívalo para este sitio y recarga la página.');
    } else {
      toast('Ocurrió un error al procesar la acción. Revisa la consola (F12) para más detalle.');
    }
  }
});
document.addEventListener('change', async (e)=>{
  if(e.target.id==='fCarrera'){ state.filters.carrera=e.target.value; renderView(); }
  if(e.target.id==='fEstado'){ state.filters.estado=e.target.value; renderView(); }
  if(e.target.id==='fEmpresa'){ state.filters.empresa=e.target.value; renderView(); }
  if(e.target.id==='fDocEstudiante'){ state.docFilters.estudiante=e.target.value; renderView(); }
  if(e.target.id==='fDocEstado'){ state.docFilters.estado=e.target.value; renderView(); }
  if(e.target.id==='logoInput'){
    const f = e.target.files[0]; if(!f) return;
    const b64 = await fileToBase64(f);
    config().logoBase64 = b64; await saveData(); renderView(); toast('Logo institucional actualizado');
  }
  if(e.target.id==='fotoInput'){
    const f = e.target.files[0]; if(!f) return;
    const b64 = await fileToBase64(f);
    newStudentFotoBase64 = b64;
    const prev = document.getElementById('fotoPreview'); if(prev) prev.src = b64;
  }
  if(e.target.id==='fotoInputDetail'){
    const f = e.target.files[0]; if(!f) return;
    const b64 = await fileToBase64(f);
    const s = getStudent(e.target.dataset.id); if(!s) return;
    s.fotoBase64 = b64;
    const prev = document.getElementById('fotoPreviewDetail'); if(prev) prev.src = b64;
    await saveData(); renderView(); toast('Foto actualizada');
  }
});

/* ============================================================
   INIT
   ============================================================ */
(async function init(){
  initAuthUI();
  const { data: { session } } = await sb.auth.getSession();
  if(session && session.user){
    currentUser = session.user;
    document.getElementById('login-root').style.display='none';
    document.getElementById('app').style.display='flex';
    document.getElementById('view-root').innerHTML = '<div class="empty-state">Cargando expedientes...</div>';
    await loadData();
    renderView();
  }
  sb.auth.onAuthStateChange((event, session)=>{
    if(event==='SIGNED_OUT'){
      currentUser = null;
      document.getElementById('app').style.display='none';
      document.getElementById('login-root').style.display='flex';
    }
  });
})();
</script>
