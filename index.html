<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Prácticas · Sistema de Gestión</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">

<style>
:root{
  --navy:#16213E;
  --navy-2:#202B4E;
  --navy-3:#2B3A66;
  --paper:#EEF0EE;
  --card:#FFFFFF;
  --ink:#1B1F27;
  --slate:#5B6472;
  --slate-2:#88909A;
  --border:#DDDFDA;
  --gold:#B7862B;
  --gold-soft:#F1E3C6;
  --green:#2F6F4E;
  --green-soft:#E1EFE6;
  --wine:#7A2E3B;
  --wine-soft:#F3E3E6;
  --amber:#9C6B12;
  --amber-soft:#F4E7CE;
  --blue:#2C5F8A;
  --blue-soft:#E1EBF3;
  --radius:10px;
  --shadow: 0 1px 2px rgba(22,33,62,.06), 0 8px 24px rgba(22,33,62,.06);
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  font-family:'IBM Plex Sans',system-ui,sans-serif;
  background:var(--paper);
  color:var(--ink);
  -webkit-font-smoothing:antialiased;
}
h1,h2,h3,.serif{font-family:'Fraunces',serif;}
.mono{font-family:'IBM Plex Mono',monospace;}
#app{display:flex;min-height:100vh;}

/* ---------- Sidebar ---------- */
.sidebar{
  width:236px;flex-shrink:0;background:var(--navy);
  color:#DCE1EE;display:flex;flex-direction:column;
  position:sticky;top:0;height:100vh;
}
.brand{padding:22px 20px 16px;border-bottom:1px solid rgba(255,255,255,.08);}
.brand-mark{display:flex;align-items:center;gap:10px;}
.brand-seal{width:34px;height:34px;border-radius:50%;border:1.5px solid var(--gold);display:flex;align-items:center;justify-content:center;flex-shrink:0;overflow:hidden;background:#fff;}
.brand-seal img{width:100%;height:100%;object-fit:contain;}
.brand-seal svg{width:18px;height:18px;}
.brand-name{font-family:'Fraunces',serif;font-size:15.5px;font-weight:600;line-height:1.15;color:#fff;}
.brand-sub{font-size:10.5px;color:#93A0BE;letter-spacing:.06em;text-transform:uppercase;margin-top:2px;}
.nav{flex:1;padding:14px 10px;overflow-y:auto;}
.nav-item{
  display:flex;align-items:center;gap:11px;padding:10px 12px;border-radius:8px;
  font-size:13.5px;color:#B9C2D6;cursor:pointer;margin-bottom:2px;transition:background .15s,color .15s;
  border-left:2px solid transparent;
}
.nav-item svg{width:17px;height:17px;flex-shrink:0;opacity:.85;}
.nav-item:hover{background:rgba(255,255,255,.06);color:#fff;}
.nav-item.active{background:rgba(183,134,43,.16);color:#fff;border-left:2px solid var(--gold);}
.nav-foot{padding:14px 20px 20px;font-size:10.5px;color:#7583A3;border-top:1px solid rgba(255,255,255,.08);}

/* ---------- Main ---------- */
.main{flex:1;min-width:0;display:flex;flex-direction:column;}
.topbar{
  background:var(--card);border-bottom:1px solid var(--border);
  padding:14px 28px;display:flex;align-items:center;gap:18px;position:sticky;top:0;z-index:20;
}
.topbar h1{margin:0;font-size:19px;font-weight:600;color:var(--navy);flex-shrink:0;}
.search-wrap{flex:1;max-width:420px;position:relative;}
.search-wrap input{
  width:100%;padding:9px 12px 9px 34px;border:1px solid var(--border);border-radius:8px;
  font-size:13px;font-family:inherit;background:var(--paper);
}
.search-wrap svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);width:15px;height:15px;color:var(--slate-2);}
.btn-primary{
  background:var(--navy);color:#fff;border:none;padding:9px 16px;border-radius:8px;
  font-size:13px;font-weight:600;cursor:pointer;font-family:inherit;display:inline-flex;align-items:center;gap:7px;
  transition:background .15s;white-space:nowrap;
}
.btn-primary:hover{background:var(--navy-3);}
.btn-primary.gold{background:var(--gold);}
.btn-primary.gold:hover{background:#a3781f;}
.btn-secondary{
  background:#fff;color:var(--navy);border:1px solid var(--border);padding:8px 14px;border-radius:8px;
  font-size:13px;font-weight:600;cursor:pointer;font-family:inherit;display:inline-flex;align-items:center;gap:6px;
}
.btn-secondary:hover{background:var(--paper);}
.btn-danger{background:#fff;color:var(--wine);border:1px solid var(--wine-soft);padding:7px 12px;border-radius:7px;font-size:12.5px;font-weight:600;cursor:pointer;font-family:inherit;}
.btn-ghost{background:transparent;border:none;color:var(--slate);cursor:pointer;font-family:inherit;font-size:13px;padding:6px 8px;border-radius:6px;}
.btn-ghost:hover{background:var(--paper);}
.content{padding:26px 28px 60px;max-width:1320px;width:100%;margin:0 auto;}

/* ---------- Cards / grid ---------- */
.grid-cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:14px;margin-bottom:22px;}
.stat-card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:16px 18px;box-shadow:var(--shadow);}
.stat-card .num{font-family:'Fraunces',serif;font-size:28px;font-weight:600;color:var(--navy);line-height:1;}
.stat-card .label{font-size:11.5px;color:var(--slate);margin-top:6px;letter-spacing:.02em;}
.stat-card.accent{border-left:3px solid var(--gold);}
.charts-row{display:grid;grid-template-columns:1.3fr 1fr;gap:16px;margin-bottom:22px;}
.chart-card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:18px 20px;box-shadow:var(--shadow);position:relative;height:280px;display:flex;flex-direction:column;}
.chart-card h3{margin:0 0 12px;font-size:13.5px;font-weight:600;color:var(--navy);text-transform:uppercase;letter-spacing:.04em;}
.chart-card .chart-wrap{position:relative;flex:1;min-height:0;}
.chart-card canvas{max-height:230px;}
.stat-card.clickable{cursor:pointer;transition:transform .12s,box-shadow .12s;}
.stat-card.clickable:hover{transform:translateY(-2px);box-shadow:0 8px 22px rgba(22,33,62,.12);}

.panel{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);}
.panel-head{padding:16px 20px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;}
.panel-head h2{margin:0;font-size:16.5px;font-weight:600;color:var(--navy);}
.panel-body{padding:18px 20px;}

/* ---------- Table ---------- */
table{width:100%;border-collapse:collapse;font-size:13px;}
th{text-align:left;font-size:10.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--slate);padding:10px 12px;border-bottom:1.5px solid var(--border);}
td{padding:11px 12px;border-bottom:1px solid var(--border);vertical-align:middle;}
tr.row-clickable{cursor:pointer;}
tr.row-clickable:hover td{background:var(--paper);}
td.row-clickable{cursor:pointer;color:var(--navy);font-weight:600;}
td.row-clickable:hover{text-decoration:underline;}
.avatar-mini{width:26px;height:26px;border-radius:50%;background:var(--navy-2);color:#fff;display:inline-flex;align-items:center;justify-content:center;font-size:10.5px;font-weight:600;margin-right:8px;}
.pill{display:inline-flex;align-items:center;gap:5px;padding:3px 9px 3px 7px;border-radius:99px;font-size:11px;font-weight:600;}
.pill svg{flex-shrink:0;}
.dot{width:6px;height:6px;border-radius:50%;}
.filters-row{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px;}
select,input[type=text],input[type=date],input[type=number],input[type=email],input[type=tel],textarea{
  font-family:inherit;font-size:13px;padding:8px 10px;border:1px solid var(--border);border-radius:7px;background:#fff;color:var(--ink);
}
select{cursor:pointer;}

/* ---------- Forms ---------- */
.form-section{margin-bottom:20px;}
.form-section .st{display:flex;align-items:center;gap:8px;margin-bottom:12px;}
.form-section .st .bar{width:3px;height:16px;background:var(--navy);border-radius:2px;}
.form-section .st h4{margin:0;font-size:13px;text-transform:uppercase;letter-spacing:.05em;color:var(--navy);font-weight:600;}
.form-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px 16px;}
.form-grid.cols-3{grid-template-columns:repeat(3,1fr);}
.field label{display:block;font-size:11.5px;color:var(--slate);margin-bottom:5px;font-weight:500;}
.field input,.field select,.field textarea{width:100%;}
.field textarea{resize:vertical;min-height:64px;}

/* ---------- Modal ---------- */
.modal-overlay{position:fixed;inset:0;background:rgba(22,26,39,.5);display:flex;align-items:flex-start;justify-content:center;z-index:100;padding:40px 20px;overflow-y:auto;}
.modal{background:#fff;border-radius:14px;width:100%;max-width:840px;box-shadow:0 20px 60px rgba(0,0,0,.25);}
.modal-head{padding:18px 24px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;}
.modal-head h2{margin:0;font-size:17px;color:var(--navy);}
.modal-body{padding:22px 24px;max-height:70vh;overflow-y:auto;}
.modal-foot{padding:14px 24px;border-top:1px solid var(--border);display:flex;justify-content:flex-end;gap:10px;}
.close-x{cursor:pointer;background:none;border:none;font-size:20px;color:var(--slate);line-height:1;}

/* ---------- Tabs ---------- */
.tabbar{display:flex;gap:2px;border-bottom:1px solid var(--border);padding:0 20px;overflow-x:auto;background:#fbfbf9;}
.tabbtn{padding:12px 14px;font-size:12.5px;font-weight:600;color:var(--slate);cursor:pointer;border-bottom:2px solid transparent;white-space:nowrap;}
.tabbtn.active{color:var(--navy);border-bottom-color:var(--gold);}

/* ---------- Document ledger (signature element) ---------- */
.doc-ledger{background:var(--card);border:1px solid var(--border);border-radius:10px;overflow:hidden;}
.doc-ledger-head{display:grid;grid-template-columns:38px 1fr 132px 96px;column-gap:16px;padding:10px 18px;background:var(--paper);border-bottom:1px solid var(--border);font-family:'IBM Plex Mono',monospace;font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:var(--slate-2);}
.doc-row{display:grid;grid-template-columns:38px 1fr 132px 96px;column-gap:16px;align-items:center;padding:13px 18px;border-bottom:1px solid var(--border);position:relative;transition:background .12s;}
.doc-row:last-child{border-bottom:none;}
.doc-row:hover{background:var(--paper);}
.doc-row::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--border);}
.doc-row.st-completo::before{background:var(--green);}
.doc-row.st-observado::before{background:var(--wine);}
.doc-row.st-revision::before{background:var(--blue);}
.doc-num{font-family:'IBM Plex Mono',monospace;font-size:11.5px;color:var(--slate-2);}
.doc-info .dname{font-size:13px;font-weight:600;color:var(--navy);line-height:1.3;}
.doc-info .hint{margin-top:3px;}
.doc-info .hint.muted{color:var(--slate-2);font-style:italic;}
.doc-row-actions{display:flex;align-items:center;justify-content:flex-end;gap:6px;}
.icon-btn{width:30px;height:30px;flex-shrink:0;border-radius:6px;border:1px solid var(--border);background:#fff;cursor:pointer;display:flex;align-items:center;justify-content:center;color:var(--navy-2);}
.icon-btn:hover{background:var(--gold-soft);border-color:var(--gold);color:var(--gold);}
.doc-menu-wrap{position:relative;}
.doc-menu-wrap summary{list-style:none;cursor:pointer;}
.doc-menu-wrap summary::-webkit-details-marker{display:none;}
.doc-menu-wrap summary::marker{content:'';}
.doc-menu-wrap[open] .icon-btn{background:var(--paper);border-color:var(--navy-3);color:var(--navy);}
.doc-menu{position:absolute;right:0;top:36px;background:#fff;border:1px solid var(--border);border-radius:8px;box-shadow:var(--shadow);min-width:150px;z-index:30;overflow:hidden;}
.doc-menu button{display:block;width:100%;text-align:left;padding:9px 13px;font-size:12px;border:none;background:none;cursor:pointer;font-family:inherit;font-weight:600;color:var(--navy);}
.doc-menu button:hover{background:var(--paper);}
.doc-menu button.mi-positive{color:var(--green);}
.doc-menu button.mi-negative{color:var(--wine);}
.doc-menu hr{border:none;border-top:1px solid var(--border);margin:2px 0;}

/* ---------- Fases del expediente ---------- */
.doc-phases{display:flex;flex-direction:column;gap:12px;margin-bottom:16px;}
.doc-phase{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;}
.doc-phase[open]{box-shadow:var(--shadow);}
.doc-phase > summary{list-style:none;cursor:pointer;padding:14px 18px;display:flex;align-items:center;justify-content:space-between;gap:12px;}
.doc-phase > summary::-webkit-details-marker{display:none;}
.doc-phase > summary::marker{content:'';}
.phase-head-left{display:flex;align-items:center;gap:14px;min-width:0;}
.phase-num{font-family:'Fraunces',serif;font-weight:600;font-size:12.5px;color:var(--gold);border:1.5px solid var(--gold);border-radius:50%;width:28px;height:28px;display:flex;align-items:center;justify-content:center;flex-shrink:0;background:var(--gold-soft);}
.phase-titles h4{margin:0;font-size:14.5px;font-weight:600;color:var(--navy);}
.phase-titles p{margin:2px 0 0;font-size:11.5px;color:var(--slate);}
.phase-head-right{display:flex;align-items:center;gap:12px;flex-shrink:0;}
.phase-count{font-family:'IBM Plex Mono',monospace;font-size:11.5px;color:var(--slate);white-space:nowrap;}
.phase-count.complete{color:var(--green);font-weight:600;}
.phase-chevron{color:var(--slate-2);transition:transform .18s;}
.doc-phase[open] .phase-chevron{transform:rotate(90deg);}
.doc-phase .doc-ledger{border:none;border-radius:0;border-top:1px solid var(--border);}

/* ---------- misc ---------- */
.progress-bar{background:#E9E9E3;border-radius:99px;height:8px;overflow:hidden;}
.progress-bar > div{height:100%;background:linear-gradient(90deg,var(--gold),var(--navy-3));}
.empty-state{text-align:center;padding:50px 20px;color:var(--slate);}
.empty-state svg{width:40px;height:40px;color:var(--slate-2);margin-bottom:10px;}
.banner-complete{background:var(--green-soft);border:1px solid #BEE0CC;color:var(--green);border-radius:10px;padding:14px 18px;display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:16px;font-weight:600;}
.small-list{list-style:none;padding:0;margin:0;}
.small-list li{padding:9px 0;border-bottom:1px solid var(--border);font-size:12.5px;display:flex;justify-content:space-between;gap:10px;}
.toast{position:fixed;bottom:22px;right:22px;background:var(--navy);color:#fff;padding:12px 18px;border-radius:9px;font-size:13px;box-shadow:var(--shadow);z-index:300;font-weight:500;}
.hint{font-size:11.5px;color:var(--slate-2);margin-top:4px;}
.logo-preview{width:60px;height:60px;border-radius:8px;border:1px solid var(--border);object-fit:contain;background:#fff;padding:4px;}
.foto-preview{width:60px;height:60px;border-radius:50%;border:1px solid var(--border);object-fit:cover;background:#fff;flex-shrink:0;}
.avatar-mini img{width:100%;height:100%;border-radius:50%;object-fit:cover;}
.entry-row{border:1px solid var(--border);border-radius:8px;padding:10px 12px;margin-bottom:8px;font-size:12.5px;}
.entry-row .ehead{font-weight:600;color:var(--navy);margin-bottom:3px;display:flex;justify-content:space-between;}
.badge-count{background:var(--navy);color:#fff;font-size:10.5px;font-weight:700;border-radius:99px;padding:1px 7px;}

/* ---------- Documentación agrupada ---------- */
.doc-filter-card{cursor:pointer;transition:transform .12s,box-shadow .12s,border-color .12s;border-left:3px solid var(--border) !important;}
.doc-filter-card:hover{transform:translateY(-2px);box-shadow:0 8px 22px rgba(22,33,62,.10);}
.doc-filter-card.active{box-shadow:0 0 0 2px var(--navy) inset;}
.doc-filter-top{display:flex;align-items:center;justify-content:space-between;}
.doc-filter-icon{display:flex;align-items:center;justify-content:center;width:32px;height:32px;border-radius:9px;flex-shrink:0;}
.panel-head-icon{display:flex;align-items:center;color:var(--gold);flex-shrink:0;}
.visit-alert-row{display:flex;align-items:center;gap:12px;padding:12px 6px;border-bottom:1px solid var(--border);}
.visit-alert-row:last-child{border-bottom:none;}
.visit-alert-row .va-info{flex:1;min-width:0;}
.visit-alert-row .va-name{font-weight:600;color:var(--navy);font-size:13.5px;}
.visit-alert-row .va-meta{font-size:11.5px;color:var(--slate);margin-top:1px;}
.eval-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:14px;}
.eval-card{border:1px solid var(--border);border-radius:12px;background:#fff;padding:16px;display:flex;flex-direction:column;gap:13px;transition:box-shadow .15s,transform .15s;}
.eval-card:hover{box-shadow:0 8px 22px rgba(22,33,62,.10);transform:translateY(-2px);}
.eval-card-head{display:flex;align-items:center;gap:10px;flex-wrap:wrap;}
.eval-card-head .va-info{flex:1;min-width:0;}
.eval-scores{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;}
.eval-score-chip{display:flex;align-items:center;gap:7px;background:var(--paper);border-radius:8px;padding:8px 8px;min-width:0;}
.eval-score-chip .esc-icon{display:flex;color:var(--navy);flex-shrink:0;}
.eval-score-chip .esc-body{min-width:0;}
.eval-score-chip .esc-label{font-size:9.5px;color:var(--slate);text-transform:uppercase;letter-spacing:.03em;white-space:nowrap;}
.eval-score-chip .esc-val{font-size:14.5px;font-weight:700;color:var(--navy);font-family:'Fraunces',serif;}
.eval-footer{display:flex;align-items:center;justify-content:space-between;padding-top:12px;border-top:1px solid var(--border);}
.eval-nota{display:flex;flex-direction:column;}
.eval-nota .en-label{font-size:10.5px;color:var(--slate);}
.eval-nota .en-val{font-size:23px;font-weight:700;font-family:'Fraunces',serif;}
.doc-filterbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;}
.doc-filterbar select{padding:8px 12px;border:1px solid var(--border);border-radius:8px;font-size:12.5px;font-family:inherit;background:#fff;color:var(--ink);}
.doc-group{border:1px solid var(--border);border-radius:10px;margin-bottom:14px;overflow:hidden;background:#fff;}
.doc-group-head{display:flex;align-items:center;gap:12px;padding:13px 16px;background:var(--paper);border-bottom:1px solid var(--border);}
.doc-group-head .dgh-info{flex:1;min-width:0;}
.doc-group-head .dgh-name{font-weight:600;color:var(--navy);font-size:14px;}
.doc-group-head .dgh-meta{font-size:11.5px;color:var(--slate);margin-top:1px;}
.doc-group-progress{display:flex;align-items:center;gap:8px;flex-shrink:0;}
.doc-group-progress .bar-track{width:70px;height:6px;border-radius:99px;background:var(--border);overflow:hidden;}
.doc-group-progress .bar-fill{height:100%;background:var(--green);border-radius:99px;}
.doc-group-progress .bar-label{font-size:11px;color:var(--slate);white-space:nowrap;font-weight:600;}
.doc-row{display:flex;align-items:center;gap:14px;padding:11px 16px;border-bottom:1px solid var(--border);}
.doc-row:last-child{border-bottom:none;}
.doc-row:hover{background:var(--paper);}
.doc-row-icon{display:flex;align-items:center;justify-content:center;width:30px;height:30px;border-radius:8px;flex-shrink:0;}
.doc-row .doc-name{flex:1;min-width:0;font-size:13px;color:var(--ink);font-weight:500;}
.doc-row .doc-file{font-size:11.5px;color:var(--slate-2);flex-shrink:0;min-width:90px;text-align:right;}
.doc-row .doc-action{flex-shrink:0;}
.doc-empty-state{padding:48px 20px;text-align:center;color:var(--slate);}
.doc-empty-state svg{color:var(--green);margin-bottom:10px;}
.carrera-section{margin-bottom:18px;}
.carrera-section:last-child{margin-bottom:0;}
.carrera-head{display:flex;align-items:center;gap:10px;padding:11px 4px;cursor:pointer;border-bottom:2px solid var(--navy);margin-bottom:14px;}
.carrera-head .chev{display:flex;color:var(--navy);transition:transform .15s;flex-shrink:0;}
.carrera-head .chev.collapsed{transform:rotate(-90deg);}
.carrera-head .carrera-icon{display:flex;color:var(--gold);flex-shrink:0;}
.carrera-head .carrera-name{font-family:'Fraunces',serif;font-weight:600;font-size:16px;color:var(--navy);flex:1;min-width:0;}
.carrera-head:hover .carrera-name{color:var(--gold);}
@media (max-width:880px){
  .sidebar{position:fixed;left:-236px;transition:left .2s;z-index:200;}
  .form-grid,.form-grid.cols-3{grid-template-columns:1fr;}
  .charts-row{grid-template-columns:1fr;}
  .doc-ledger-head{display:none;}
  .doc-row{display:flex;flex-wrap:wrap;align-items:flex-start;row-gap:8px;column-gap:10px;}
  .doc-num{order:1;}
  .doc-info{order:2;flex:1;min-width:140px;}
  .doc-status{order:3;}
  .doc-row-actions{order:4;width:100%;justify-content:flex-start;}
}

/* ---------- Login ---------- */
.login-screen{min-height:100vh;display:flex;align-items:center;justify-content:center;background:linear-gradient(160deg,#0F1830 0%,var(--navy) 55%,#1B2A52 100%);padding:20px;position:relative;overflow:hidden;}
.login-screen::before{content:'';position:absolute;top:-30%;right:-10%;width:60%;height:80%;background:radial-gradient(circle,rgba(183,134,43,.12) 0%,transparent 70%);}
.login-screen::after{content:'';position:absolute;bottom:-20%;left:-10%;width:50%;height:60%;background:radial-gradient(circle,rgba(183,134,43,.08) 0%,transparent 70%);}
.login-card{background:#fff;border-radius:16px;width:100%;max-width:400px;padding:0;box-shadow:0 25px 70px rgba(0,0,0,.4);position:relative;z-index:1;overflow:hidden;}
.login-band{background:var(--navy);padding:30px 30px 22px;text-align:center;border-bottom:3px solid var(--gold);}
.login-seal{width:78px;height:78px;border-radius:50%;background:#fff;padding:6px;margin:0 auto 14px;box-shadow:0 4px 14px rgba(0,0,0,.25);}
.login-seal img{width:100%;height:100%;object-fit:contain;border-radius:50%;}
.login-band h1{font-size:16.5px;line-height:1.35;margin:0 0 4px;color:#fff;font-weight:600;letter-spacing:.2px;}
.login-band .rbd{font-size:10.5px;color:var(--gold-soft);letter-spacing:.6px;text-transform:uppercase;}
.login-body{padding:28px 30px 32px;}
.login-card .sub{text-align:center;font-size:12.5px;color:var(--slate);margin-bottom:22px;}
.login-field{margin-bottom:14px;}
.login-field label{display:block;font-size:11.5px;color:var(--slate);margin-bottom:5px;font-weight:500;}
.login-field input{width:100%;padding:10px 12px;border:1px solid var(--border);border-radius:8px;font-size:13.5px;font-family:inherit;}
.login-field input:focus{outline:none;border-color:var(--gold);box-shadow:0 0 0 3px var(--gold-soft);}
.login-error{background:var(--wine-soft);color:var(--wine);border-radius:8px;padding:9px 12px;font-size:12.5px;margin-bottom:14px;display:none;}
.login-error.show{display:block;}
.login-btn{width:100%;background:var(--navy);color:#fff;border:none;padding:12px;border-radius:8px;font-size:13.5px;font-weight:600;cursor:pointer;font-family:inherit;margin-top:6px;letter-spacing:.2px;}
.login-btn:hover{background:var(--navy-3);}
.login-btn:disabled{opacity:.6;cursor:default;}
.login-foot{text-align:center;font-size:10.5px;color:var(--slate-2);margin-top:18px;letter-spacing:.2px;}
.user-badge{display:flex;align-items:center;gap:8px;margin-left:auto;padding-left:14px;}
.user-badge .ub-email{font-size:12px;color:var(--slate);}
.user-badge button{background:transparent;border:1px solid var(--border);color:var(--slate);padding:6px 12px;border-radius:7px;font-size:12px;cursor:pointer;font-family:inherit;font-weight:600;}
.user-badge button:hover{background:var(--paper);}
</style>
</head>

      {num:'2', nombre:'Trazar partes y piezas en construcciones metálicas', tareas:['2.1 Programa el trazado de partes y piezas según las especificaciones técnicas del proyecto, y prepara los útiles, herramientas, materiales, plantillas y croquis necesarios para llevarlo a cabo.', '2.2 Ejecuta el trazado de piezas y partes de Construcciones metálicas para los trabajos de fabricación, mantenimiento y reparación según los planos y las especificaciones técnicas del proyecto, cumpliendo con los estándares de calidad, las normas de seguridad y medioambientales y los plazos establecidos.']},

      {num:'4', nombre:'Mecanizado de partes y piezas metálicas', tareas:['4.1 Programa con apoyo de las TIC el mecanizado y conformado de partes y piezas, y prepara las herramientas, las máquinas y los equipos a utilizar, estableciendo el tiempo a emplear en cada una de las actividades, según los planos y las especificaciones técnicas del proyecto.', '4.2 Ejecuta el mecanizado y conformado de chapas, perfiles y tubos de acuerdo a estándares de calidad según las normas, operando las máquinas y herramientas de acuerdo a los planos y las especificaciones técnicas del proyecto, previniendo situaciones de riesgo y cumpliendo con los plazos establecidos.']},
      {num:'5', nombre:'Cortar y soldar en construcciones metálicas', tareas:['5.1 Programa con apoyo de las TIC todas las actividades de corte, de acuerdo a los planos y las especificaciones técnicas del proyecto y según normas de seguridad y medioambientales', '5.2 Ejecuta todas las actividades de corte para fabricar y reparar elementos de construcciones metálicas con precisión según las especificaciones técnicas del proyecto, cumpliendo las normas de seguridad, medioambientales y de calidad exigidas y utilizando eficientemente los insumos.', '5.3 Programa todas las actividades para unir y reparar con calidad piezas y partes (planchas, perfiles, tubos) con soldadura eléctrica (TIG y MIG/MAG), de acuerdo a los requisitos de las especificaciones técnicas del proyecto y las normas de higiene, seguridad industrial y medioambiental.', '5.4 Ejecuta las actividades de soldadura en posición plana, horizontal y vertical, según la ubicación del material, en atmósfera natural o protegida (fuentes de poder eléctrica, oxigás o mecánicas), con equipos al arco manual, TIG, MIG/MAG y oxiacetilénico, en chapas, perfiles y tubos, de acuerdo a las normas de calidad según las especificaciones técnicas del proyecto, utilizando de manera eficiente los insumos y usando los elementos de protección personal.', '5.5 Programa la solución más apropiada de reparación de los defectos de soldadura (discontinuidades), realizando una inspección visual y ensayos no destructivos o destructivos al elemento soldado, según el requerimiento de las normas de soldadura, de acuerdo a los procedimientos normados de calidad, medioambiente y seguridad.', '5.6 Efectúa uniones mecánicas según las especificaciones técnicas del proyecto y respetando las normas de seguridad.']},
      {num:'6', nombre:'Armar y ejecutar montaje en construcciones metálicas', tareas:['6.1 Programa con apoyo de las TIC actividades de armado y montaje de una estructura metálica (a través de cartas Gantt, protocolos de armado y montaje, protocolos de seguridad y medioambientales) y establece los plazos de tiempo para el proceso, de acuerdo a los planos, las especificaciones técnicas del proyecto y los estándares de calidad.', '6.2 Revisa que el lugar de trabajo, las máquinas, las herramientas, los equipos y los elementos metálicos cumplan con las normas de seguridad y se encuentren de acuerdo a las especificaciones técnicas del proyecto.', '6.3 Ejecuta las actividades de armado y montaje, en obra o taller, de elementos, subconjuntos de partes y piezas y estructuras metálicas livianas, de acuerdo a las especificaciones técnicas del proyecto, utilizando eficientemente los insumos, utilizando eficientemente el tiempo y aplicando las normas de seguridad.']},
      {num:'7', nombre:'Proteger las estructuras y tratar los residuos', tareas:['7.1 Programa en forma digital las actividades de tratamiento de protección de una estructura metálica, de acuerdo a las especificaciones técnicas del proyecto y las normas medioambientales y de seguridad vigentes', '7.2 Prepara el lugar de trabajo y verifica que los insumos, las herramientas y los equipos a utilizar cumplan con los requisitos correspondientes, según las especificaciones del proyecto, las normas medioambientales y de seguridad vigentes.', '7.3 Aplica técnicas de limpieza y protección de superficies de estructuras metálicas, de acuerdo a las especificaciones técnicas del proyecto y las normas de seguridad medioambientales y de calidad vigentes.', '7.4 Programa en formato digital todas las actividades de tratamiento de residuos y desechos de las construcciones metálicas, de acuerdo a las normas medioambientales vigentes.', '7.5 Ejecuta cuidadosamente el tratamiento de residuos y desechos de construcciones metálicas, aplicando técnicas compatibles con el cuidado del medioambiente y previniendo situaciones de riesgo.']},
      {num:'8', nombre:'Cubicar los materiales e insumos en construcciones metálicas', tareas:['8.1 Cubica todos los materiales, insumos y elementos de estructuras metálicas a utilizar según principios matemáticos y los planos y las especificaciones técnicas del proyecto.', '8.2 Calcula el rendimiento de cada material y recurso utilizado en la construcción de estructuras metálicas, de acuerdo a los planos y las especificaciones técnicas del proyecto.', '8.3 Ejecuta un análisis, con apoyo de las TIC, de los precios unitarios y presupuesto de cada partida de construcciones metálicas, de acuerdo a los planos y las especificaciones técnicas del proyecto y los catálogos de los distribuidores.']},
    ],

  'Gastronomía Mención Cocina': {
    areas: [
      {num:'1', nombre:'Higienizar para la elaboración de Alimentos', tareas:['1.1 Higieniza insumos, utensilios, equipos, infraestructura y áreas de trabajo, de acuerdo al trabajo a realizar, considerando los protocolos de seguridad alimentaria establecidos en el Reglamento Sanitario de los Alimentos (RSA).', '1.2 Manipula materias primas, insumos, alimentos, de acuerdo a las normas de higiene de la legislación vigente, considerando y aplicando estándares de calidad, y previniendo situaciones de riesgo.', '1.3 Aplica los siete principios del sistema de Análisis de Peligros y Puntos Críticos de Control (HACCP, sigla en inglés) en los procesos productivos.', '1.4 Controla la calidad de las materias primas, insumos, productos intermedios y finales con los sistemas establecidos por la normativa vigente y/o manuales pre establecidos.']},
      {num:'2', nombre:'Elaborar alimentos de baja complejidad', tareas:['2.1 Organiza equipos y utensilios, considerando uso, volumen de producción y normas de higiene y prevención de riesgos', '2.2 Elabora productos gastronómicos fríos y calientes, con materias primas de origen vegetal y/o animal, utilizando equipos y utensilios, aplicando normas de higiene y de prevención de riesgos.', '2.3 Aplica técnicas de cortes en alimentos de origen vegetal, aplicando las normas de higiene, haciendo uso eficiente de los insumos y disponiendo de los desechos de forma responsable, considerando la prevención de los riesgos propios de la actividad.', '2.4 Aplica técnicas de cocción en distintos alimentos, de acuerdo al sistema productivo, aplicando las normas de higiene necesarias para la inocuidad de los alimentos, haciendo uso eficiente de los insumos y disponiendo de los desechos de forma responsable.', '2.5 Elabora platos de la cocina básica nacional e internacional, fríos y calientes, utilizando la ficha técnica y aplicando normas de higiene necesarias para la inocuidad de los alimentos, haciendo un uso eficiente de los insumos y disponiendo de los desechos de forma responsable.', '2.6 Prepara alimentos de acuerdo a las especificaciones y dietas indicadas en la ficha técnica y /o por la jefatura directa, considerando las normas de higiene necesarias para la inocuidad de los alimentos, cumpliendo con los estándares de calidad, realizando las tareas de forma prolija, haciendo uso eficiente de los insumos y disponer de los desechos de forma responsable']},
      {num:'3', nombre:'Recepcionar y almacenar insumos', tareas:['3.1 Solicita insumos y productos, de acuerdo a los requerimientos de la producción, considerando indicaciones específicas del pedido.', '3.2 Recepciona mercadería, de acuerdo a protocolos definidos, considerando las normas establecidas en el Reglamento Sanitario de los Alimentos, aplicando estándares de calidad.', '3.3 Almacena mercadería de acuerdo a la naturaleza del producto y protocolos establecidos, considerando las normas del Reglamento Sanitario de los Alimentos y normas de seguridad.']},
      {num:'4', nombre:'Planificar la producción gastronómica', tareas:['4.1 Selecciona insumos, utensilios y equipos, de acuerdo al tipo de producción a elaborar, considerando las normas de higiene necesarias para la inocuidad de los alimentos', '4.2 Planifica la producción de acuerdo a la ficha técnica, considerando los estándares de calidad y realizando las tareas de forma prolija', '4.3 Realiza mise en place de insumos alimenticios y utensilios, de acuerdo a la producción, aplicando las normas de higiene necesarias, actuando con prolijidad para prevenir riesgos ocupacionales y de los clientes.']},
      {num:'5', nombre:'Preparar y diseñar montaje de buffet', tareas:['5.1 Planifica la decoración y presentación de productos, considerando las técnicas culinarias, los tiempos de preparación y el tipo de servicio solicitado.', '5.2 Elabora y realiza montaje de platos, aplicando normas de presentación, de acuerdo al tipo de menú o carta y tipo de servicio, considerando las normas de higiene necesarias para la producción de alimentos inocuos, haciendo uso eficiente de los insumos y disponiendo de los desechos de manera responsable', '5.3 Diseña y monta diferentes tipos de buffet, de acuerdo a lo solicitado por el cliente, considerando las normas de higiene necesarias para la inocuidad de los alimentos, el personal necesario para el evento, produciendo un trabajo en equipo']},
      {num:'6', nombre:'Atender comedores, bares y salones', tareas:['6.1 Selecciona implementos, ornamentos y utensilios, de acuerdo al tipo de servicio a entregar, considerando las normas de higiene', '6.2 Decora, con los implementos, ornamentos y utensilios seleccionados, los lugares definidos de acuerdo al tipo de servicio a entregar, considerando las normas de higiene, realizando un trabajo prolijo, y en equipo.']},
      {num:'7', nombre:'Preparar productos básicos de Cocina chilena', tareas:['1.1 Selecciona distintos tipos de productos típicos de la cocina chilena, considerando las zonas del país y la estacionalidad', '1.2 Elabora preparaciones de la cocina tradicional chilena, propias de la zona norte, centro y sur del país, aplicando la higiene y los estándares de calidad requeridos', '1.3 Elabora preparaciones de la cocina tradicional chilena, de las distintas zonas del país, considerando los requerimientos de alimentación saludable, aplicando la higiene y los estándares de calidad requeridos.']},
      {num:'8', nombre:'Innovar y preparar productos básicos de cocina internacional', tareas:['8.1 Clasifica los productos propios de la cocina de países tales como; Perú, China, México, Francia, Italia, entre otros, participando de diversas situaciones de aprendizaje, considerando un trabajo prolijo', '8.2 Elabora platos de la cocina internacional de mayor presencia en Chile, como México, China, Perú, Japón, Francia e Italia, considerando las normas de higiene necesarias para la inocuidad de los alimentos, cumpliendo con los estándares de calidad, realizando las tareas de forma prolija, haciendo uso eficiente de los insumos y disponer de los desechos de forma responsable', '8.3 Elabora productos gastronómicos, aplicando técnicas innovadoras en la producción, considerando las normas de higiene y realizando las tareas de forma prolija, cumpliendo con los estándares de calidad, haciendo uso eficiente de los insumos, previniendo situaciones de riesgo.', '8.4 Aplica técnicas innovadoras de decoración y montaje, para mejorar sabores, texturas y presentaciones en productos gastronómicos de la cocina básica, considerando las normas de higiene necesarias para la inocuidad de los alimentos y realizando las tareas de forma prolija, cumpliendo con los estándares de calidad, haciendo uso eficiente de los insumos, previniendo situaciones de riesgo.']},
      {num:'9', nombre:'Elaborar bebidas alcohólicas y analcohólicas', tareas:['3.1 Elabora bebestibles alcohólicos, de acuerdo al recetario nacional e internacional, considerando las normas de higiene necesarias para inocuidad de los productos, haciendo uso eficiente de los insumos, trabajando de forma coordinada', '3.2 Elabora cocteles con bebidas analcohólicas, de acuerdo al recetario nacional e internacional, aplicando las normas de higiene']},
      {num:'10', nombre:'Elaborar cartas y menús para servicios y Establecimientos de consumo frecuente', tareas:['10.1 Diseña menú, teniendo en cuenta tipo de servicio y establecimiento, considerando la estacionalidad, tipo de cliente, y requerimientos nutricionales', '10.2 Diseña cartas, de acuerdo al establecimiento, al tipo de servicio, aplicando las normas de higiene necesarias para la inocuidad de los alimentos y realizando las tareas de forma prolija, cumpliendo con los estándares de calidad']},

  'Mecánica Automotriz': {
    areas: [
      {num:'1', nombre:'AJUSTAR MOTORES', tareas:['1 Diagnostica el estado del motor a gasolina y/o diésel, utilizando herramientas e instrumentos apropiados, y comparando los datos con los del manual de servicio.', '2 Verifica y reemplaza componentes del conjunto móvil, del motor a gasolina y/o diésel (biela, pistón, eje cigüeñal), siguiendo indicaciones del manual de servicio.', '3 Verifica el estado delos integrantes del conjunto fijo del motor, del motor a gasolina y/o diésel (culata, block, cárter), siguiendo indicaciones del manual del fabricante.', '4 Reemplaza y prueba componentes de sistemas del motor, aplicando normas de seguridad y medio ambientales, de acuerdo a instrucciones del manual del fabricante']},
      {num:'2', nombre:'LEER PLANOS Y MANUALES TECNICOS', tareas:['1.Lee e interpreta manuales técnicos de diferentes vehículos para conocer las especificaciones técnicas entregadas por el fabricante', '2 Lee e interpreta la información descrita en planos y diagramas de los distintos manuales para ejecutar procesos de mantenimiento y/o reparación de un vehículo automotriz.', '3 Diagnostica y resuelve fallas interpretando manuales técnicos de diferentes vehículos motorizados, basado en las normas nacionales e internacionales de emisión de gases.']},
      {num:'3', nombre:'MANEJAR RESIDUOS Y DESECHOS AUTOMOTRICES', tareas:['1 Reconoce los principales residuos y desechos de vehículos motorizados, aplicando técnicas compatibles con el cuidado y medioambiente, de acuerdo a la normativa vigente.', '2 Aplica procedimientos para la prevención y el control de emergencias en el almacenamiento, transporte, manejo y manipulación de materiales peligrosos en un taller mecánico, de acuerdo a los procedimientos y la normativa vigente.']},
      {num:'4', nombre:'MANTENER LOS SISTEMAS DE SEGURIDAD Y CONFORTABILIDAD', tareas:['1 Lee e interpreta circuitos eléctricos, esquemas o planos de conjuntos o componentes, del sistema de seguridad, pasiva y activa, que aparecen en los documentos del manual del fabricante.', '2 Desmonta y monta sistemas de seguridad pasiva y activa de vehículos automotrices, siguiendo las instrucciones del manual de servicio y respetando las normas de seguridad y medioambiente.', '3 Lee e interpreta circuitos eléctricos, esquemas o planos de conjuntos o componentes, y determina el diagnóstico y mantenimiento del sistema de confortabilidad, de acuerdo a información técnica del manual del fabricante.', '4 Desmonta y monta conjuntos y componentes de sistemas de confortabilidad devehículos automotrices, siguiendo instrucciones del manual de servicio, respetando las normas de seguridad y del medioambiente.']},
      {num:'5', nombre:'MANTENER LOS SISTEMAS ELECTRICOS Y ELECTRONICOS', tareas:['1 Diagnostica y detecta fallas a circuitos eléctricos de vehículos automotrices, respetando las normas de seguridad, de acuerdo a las indicaciones del fabricante y estándares internacionales.', '2 Reemplaza y prueba componentes de los distintos sistemas eléctricos y electrónicos de los vehículos automotrices, respetando las normas de seguridad, de acuerdo a los procedimientos del manual de servicio.', '3 Reemplaza y prueba componentes a los sistemas de encendido del motor Otto e inyección del motor de ciclo Otto y Diesel, respetando las normas de seguridad, de acuerdo a las especificaciones técnicas del fabricante', '4 Aplica procedimientos de mantenimiento y diagnóstico comprobando y reemplazando componentes del sistema de carga y arranque del vehículo y respetando las normas de seguridad, de acuerdo a las especificaciones técnicas del fabricante.']},
      {num:'6', nombre:'MANTENER LOS MOTORES', tareas:['1 Controla el funcionamiento mecánico del motor, verificando magnitudes con equipos e instrumentos análogos y digitales, respetando las normas de seguridad, de acuerdo a las especificaciones técnicas del fabricante', '2 Realiza mantenimiento correctivo en relación al funcionamiento mecánico, eléctrico o electrónico del motor de combustión interna Otto y Diesel, de acuerdo a los procedimientos de detección de fallas, respetando las normas de seguridad, de acuerdo al manual del fabricante.', '3 Realiza mantenimiento programado a motores diésel y gasolina, respetando normas de seguridad y medioambiente, de acuerdo a las especificaciones técnicas del fabricante.']},
      {num:'7', nombre:'MANTENER LOS SISTEMAS HIDRAULICOS Y NEUMATICOS', tareas:['1 Prueba los diferentes sistemas hidráulicos, neumáticos y componentes de vehículos pesados, sobre la base de su funcionamiento y especificaciones técnicas del fabricante.', '2 Realiza mantenimiento y diagnóstico a los sistemas neumáticos y sus componentes de vehículos pesados, aplicando las normas de seguridad y respeto del medioambiente, de acuerdo a las especificaciones técnicas del fabricante.', '3 Realiza mantenimiento de los diferentes sistemas hidráulicos y componentes de vehículos pesados, respetando las normas de seguridad y medioambiente, de acuerdo a las especificaciones técnicas del fabricante y a los estándares internacionales.', '4 Realiza mantenimiento al sistema de transmisión de potencia manual y automática de vehículos pesados, utilizando herramientas e instrumentos apropiados, de acuerdo a los estándares internacionales, respetando las normas de seguridad de acuerdo a las especificaciones técnicas del fabricante.', '5 Realiza un diagnóstico al sistema de transmisión de potencia manual y automática de vehículos pesados y prueba componentes, utilizando herramientas e instrumentos apropiados, de acuerdo con los estándares internacionales y respetando las normas de seguridad de acuerdo a las especificaciones técnicas del fabricante.']},
      {num:'8', nombre:'MANTENER LOS SISTEMAS DE TRANSMISION Y FRENOS', tareas:['1 Realiza mantenimiento al sistema de transmisión mecánica de vehículos livianos y semipesados, de acuerdo a las pautas de mantención del fabricante, de inspección y diagnóstico de fallas.', '2 Realiza mantenimiento al sistema de transmisión automática de vehículos livianos y semipesados, de acuerdo a las pautas de mantención del fabricante, de inspección y diagnóstico de fallas.', '3 Realiza mantenimiento, inspección y diagnóstico al sistema de frenos hidráulicos de vehículos livianos y semipesados, respetando las normas de seguridad y medioambiente, de acuerdo a las pautas especificadas por el fabricante.']},
      {num:'9', nombre:'MANTENER LOS SISTEMAS DE DIRECCION Y SUSPENSION', tareas:['1 Inspecciona los diferentes mecanismos de dirección mecánica de vehículos livianos y semipesados, de acuerdo con las pautas del fabricante, de inspección y diagnóstico de fallas.', '2 Aplica mantenimiento al sistema de dirección de vehículos livianos y semipesados, de acuerdo a pautas del fabricante, de inspección y diagnóstico de fallas.', '3 Inspecciona diferentes sistemas de suspensión utilizados en vehículos livianos y semipesados, de acuerdo con las pautas del fabricante, de inspección y diagnóstico de fallas.', '4 Realiza mantenimiento, inspección y diagnóstico al sistema de suspensión de vehículos livianos y semipesados, de acuerdo a las pautas del fabricante, de inspección y diagnóstico de fallas.', '5 Realiza diagnóstico de detección y corrección de fallas en el tren trasero y/o delantero de vehículos livianos y semipesados, operando equipos y herramientas, de acuerdo a las especificaciones del fabricante.']},

  'Servicios de Turismo': {
    areas: [
      {num:'1', nombre:'Tomar reservas de distintos tipos de servicios.', tareas:['1 Realiza reservas de servicios turísticos, utilizando sistemas digitales, aplicando un lenguaje técnico y teniendo en cuenta los estándares de la industria', '2 Ejecuta reservas aéreas en línea, de acuerdo a los requerimientos del cliente.', '3 Aplica diversas formas de pago a las reservas, de acuerdo a los requerimientos expresados por el cliente y a las restricciones de la empresa.', '4 Atiende al cliente entregando información obtenida en base al software en línea, sobre destinos turísticos nacionales e internacionales, de acuerdo a lo solicitado.']},
      {num:'2', nombre:'Atender al turista de acuerdo a sus necesidades.', tareas:['1 Gestiona las respuestas y soluciones a los requerimientos de los turistas, teniendo en cuenta sus necesidades, deseos, características (género, grupo etario, cultura, entre otros) y los servicios disponibles.', '2 Orienta e informa a los clientes sobre ofertas turísticas, de manera oportuna, clara y veraz, según las necesidades y en idioma inglés, si fuese necesario.']},

function fmtDate(d){ if(!d) return '—'; const dt=new Date(d+'T00:00:00'); if(isNaN(dt)) return d; return dt.toLocaleDateString('es-CL',{day:'2-digit',month:'short',year:'numeric'}); }
function initials(name){ return (name||'—').split(' ').filter(Boolean).slice(0,2).map(p=>p[0]).join('').toUpperCase(); }
const FOTO_PLACEHOLDER = 'data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="60" height="60"><rect width="60" height="60" fill="%23DDDFDA"/><circle cx="30" cy="22" r="10" fill="%23fff"/><ellipse cx="30" cy="50" rx="18" ry="14" fill="%23fff"/></svg>';

function avatarHtml(s){ return s.fotoBase64 ? `<span class="avatar-mini"><img src="${s.fotoBase64}" alt=""></span>` : `<span class="avatar-mini">${initials(s.nombre)}</span>`; }
function pill(estado){ const c=ESTADO_COLOR[estado]||{bg:'#eee',fg:'#333'}; return `<span class="pill" style="background:${c.bg};color:${c.fg}"><span class="dot" style="background:${c.fg}"></span>${estado}</span>`; }
function docStatusPill(status){ const m=DOC_STATUS_META[status]||DOC_STATUS_META.pendiente; return `<span class="pill" style="background:${m.bg};color:${m.color}">${icon(m.icon,12)}${m.label}</span>`; }
function docsCompletedCount(s){ return DOC_TYPES.filter(d=>s.documentos[d.key].status==='completo').length; }
function progressPct(s){
  const docsPct = docsCompletedCount(s)/DOC_TYPES.length;
  const horasPct = s.horasRequeridas? Math.min(1, (s.horasRealizadas||0)/s.horasRequeridas) : 0;
  return Math.round(((docsPct*0.6)+(horasPct*0.4))*100);
}
function uniqueVals(field){ return [...new Set(students().map(s=>s[field]).filter(Boolean))].sort(); }
function isChecklistComplete(s){ return DOC_TYPES.every(d=>s.documentos[d.key].status==='completo'); }
function canFinalize(s){
  return isChecklistComplete(s) && (s.horasRealizadas>=s.horasRequeridas) && !!s.evaluacionEmpresa && !!s.evaluacionDocente && s.estado!=='Cerrada';
}
function weightedNota(s){
  const p = config().ponderaciones;
  const en = s.evaluacionEmpresa? s.evaluacionEmpresa.nota : 0;
  const dn = s.evaluacionDocente? s.evaluacionDocente.nota : 0;
  const inf = s.informeFinal? (s.informeFinal.nota||0) : 0;
  return Math.round((((en*p.empresa)+(dn*p.profesor)+(inf*p.informe))/100)*100)/100;
}
function avg(obj){ const v=Object.values(obj); return v.length? Math.round((v.reduce((a,b)=>a+Number(b),0)/v.length)*100)/100 : 0; }
const DIAS_ALERTA_VISITA = 21;
function visitaAlerts(){
  const now = new Date();
  return students().filter(s=> s.estado==='En ejecución').map(s=>{
    const registros = (s.seguimiento||[]).filter(r=>r.fecha).slice().sort((a,b)=> new Date(b.fecha)-new Date(a.fecha));
    const ultima = registros[0];
    const dias = ultima? Math.floor((now - new Date(ultima.fecha))/86400000) : null;
    const tipo = !ultima ? 'sinvisita' : (dias>DIAS_ALERTA_VISITA ? 'atrasada' : null);
    return {s, dias, tipo};
  }).filter(r=>r.tipo).sort((a,b)=>{
    if(a.tipo!==b.tipo) return a.tipo==='sinvisita' ? -1 : 1;
    return (b.dias||0)-(a.dias||0);
  });
}
function download(blob, filename){
  try{
    const url=URL.createObjectURL(blob);
    const a=document.createElement('a');
    a.href=url; a.download=filename;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(()=>URL.revokeObjectURL(url),2000);
  }catch(e){
    console.error('download error', e);
    toast('No se pudo descargar el archivo. Revisa la consola (F12).');
  }
}

async function generarInformeEmpresaPDF(nombreEmpresa){
  toast('Generando informe…');
  const list = students().filter(x=>x.empresa===nombreEmpresa);
  if(!list.length){ toast('Sin estudiantes para esta empresa'); return; }
  const ref = list[0]; const cfg = config();
  const horas = list.reduce((a,s)=>a+(Number(s.horasRealizadas)||0),0);
  const notas = list.filter(s=>s.evaluacionDocente).map(s=>s.evaluacionDocente.nota);
  const promEval = notas.length? (notas.reduce((a,b)=>a+b,0)/notas.length).toFixed(2) : '—';

  const imgHoras = await renderOffscreenChart('bar', {labels:list.map(s=>s.nombre.split(' ')[0]), datasets:[
      {label:'Requeridas', data:list.map(s=>s.horasRequeridas), backgroundColor:'#DDDFDA', borderRadius:4},
      {label:'Realizadas', data:list.map(s=>s.horasRealizadas), backgroundColor:'#16213E', borderRadius:4}]}, {}, 700, 340);

  const jsPDF = collectPDFmakerLib();
  const pdf = new jsPDF({unit:'mm', format:'a4'});
  const pw = pdf.internal.pageSize.getWidth();
  let y = addLetterhead(pdf, cfg, 'Informe de Empresa', nombreEmpresa);

  sectionTitle(pdf,15,y,'Datos de la empresa'); y+=7;
  y = addFieldGrid(pdf, y, [
    {label:'Razón social', value:nombreEmpresa},
    {label:'RUT empresa', value:ref.rutEmpresa},
    {label:'Dirección', value:ref.direccionEmpresa},
    {label:'Contacto principal', value:ref.supervisor},
  ], pw);

  sectionTitle(pdf,15,y,'Resumen'); y+=8;
  pdf.autoTable({ startY:y, margin:{left:15,right:15}, styles:{fontSize:9.5}, headStyles:{fillColor:[22,33,62]}, theme:'grid',
    head:[['Indicador','Valor']],
    body:[
      ['Estudiantes en práctica', String(list.length)],
      ['Horas de práctica registradas', horas.toLocaleString('es-CL')],
      ['Promedio evaluación docente', String(promEval)],
    ] });
  y = pdf.lastAutoTable.finalY + 12;

  y = checkPageBreakForBlock(pdf,y,cfg,6+(pw-30)*340/700);
  sectionTitle(pdf,15,y,'Horas por estudiante'); y+=6;
  y = addChartImage(pdf, imgHoras, 15, y, pw-30, (pw-30)*340/700);

  y = checkPageBreak(pdf,y,cfg);
  sectionTitle(pdf,15,y,'Detalle de estudiantes'); y+=8;
  pdf.autoTable({ startY:y, margin:{left:15,right:15}, styles:{fontSize:8}, headStyles:{fillColor:[22,33,62]},
    head:[['Estudiante','Especialidad','Supervisor','Horas','Nota','Estado']],
    body: list.map(s=>[s.nombre, s.carrera||'—', s.supervisor||'—', `${s.horasRealizadas}/${s.horasRequeridas}`, s.evaluacionDocente?s.evaluacionDocente.nota:'—', s.estado]) });

  addFooterAll(pdf);
  savePDF(pdf, `Informe_${nombreEmpresa.replace(/[^\w]+/g,'_')}_${new Date().toISOString().slice(0,10)}.pdf`);
  toast('Informe generado');
}

/* ============================================================
   RENDER: DOCUMENTACIÓN (global)
   ============================================================ */
function renderDocumentacion(){
  const list = students();
  const allRows = [];
  list.forEach(s=> DOC_TYPES.forEach(d=> allRows.push({s, d, meta:s.documentos[d.key]})));

  const counts = {pendiente:0, revision:0, observado:0, completo:0};
  allRows.forEach(r=> counts[r.meta.status] = (counts[r.meta.status]||0)+1);

  const ef = state.docFilters.estado, sf = state.docFilters.estudiante;
  let rows = allRows.filter(r=> r.meta.status!=='completo');
  if(ef) rows = rows.filter(r=> r.meta.status===ef);
  if(sf) rows = rows.filter(r=> r.s.id===sf);

  const filterCard = (label,metric,estado,color)=>{
    const active = ef===estado;
    const ic = DOC_STATUS_META[estado] ? DOC_STATUS_META[estado].icon : 'file';
    return `<div class="stat-card doc-filter-card ${active?'active':''}" style="border-left-color:${color}" data-action="doc-filter" data-estado="${estado}">
      <div class="doc-filter-top">
        <div class="num" style="color:${color};font-size:24px">${counts[estado]||0}</div>
        <span class="doc-filter-icon" style="background:${color}18;color:${color}">${icon(ic,16)}</span>
      </div>
      <div class="label">${label}</div>
    </div>`;
  };

  const groups = {};
  rows.forEach(r=>{ (groups[r.s.id] = groups[r.s.id]||{s:r.s, docs:[]}).docs.push(r); });
  const carreraGroups = {};
  Object.values(groups).forEach(g=>{
    const carrera = g.s.carrera || 'Sin especialidad asignada';
    (carreraGroups[carrera] = carreraGroups[carrera] || []).push(g);
  });
  const carreraNames = Object.keys(carreraGroups).sort((a,b)=> carreraGroups[b].reduce((n,g)=>n+g.docs.length,0) - carreraGroups[a].reduce((n,g)=>n+g.docs.length,0));

  const html = `
  <div class="grid-cards" style="grid-template-columns:repeat(auto-fit,minmax(150px,1fr));margin-bottom:18px">
    ${filterCard('Pendientes','pendiente','pendiente','var(--amber)')}
    ${filterCard('En revisión','revision','revision','var(--blue)')}
    ${filterCard('Observados','observado','observado','var(--wine)')}
    ${filterCard('Completos','completo','completo','var(--green)')}
  </div>
  <div class="panel">
    <div class="panel-head">
      <h2 style="display:flex;align-items:center;gap:9px"><span class="panel-head-icon">${icon('folder',18)}</span>Documentación por especialidad ${rows.length? `<span class="badge-count" style="margin-left:2px">${rows.length}</span>`:''}</h2>
      <div class="doc-filterbar">
        <select id="fDocEstudiante">
          <option value="">Todos los estudiantes</option>
          ${list.map(s=>`<option value="${s.id}" ${sf===s.id?'selected':''}>${s.nombre}</option>`).join('')}
        </select>
        <select id="fDocEstado">
          <option value="">Todos los estados</option>
          <option value="pendiente" ${ef==='pendiente'?'selected':''}>Pendiente</option>
          <option value="revision" ${ef==='revision'?'selected':''}>En revisión</option>
          <option value="observado" ${ef==='observado'?'selected':''}>Observado</option>
        </select>
        ${(ef||sf) ? `<button class="btn-ghost" data-action="clear-doc-filters">Limpiar filtros</button>` : ''}
      </div>
    </div>
    <div class="panel-body">
      ${carreraNames.length ? carreraNames.map(carrera=>{
        const gList = carreraGroups[carrera];
        const total = gList.reduce((n,g)=>n+g.docs.length,0);
        const key = 'esp_'+carrera.replace(/[^\w]+/g,'_');
        const collapsed = state.docCollapsed && state.docCollapsed[key];
        return `
        <div class="carrera-section">
          <div class="carrera-head" data-action="toggle-doc-carrera" data-key="${key}">
            <span class="chev ${collapsed?'collapsed':''}">${icon('chevronDown',15)}</span>
            <span class="carrera-icon">${icon('building',15)}</span>
            <span class="carrera-name">${carrera}</span>
            <span class="hint">${gList.length} estudiante${gList.length===1?'':'s'}</span>
            <span class="badge-count">${total}</span>
          </div>
          <div class="carrera-body" style="${collapsed?'display:none':''}">
          ${gList.map(g=>{
            const done = docsCompletedCount(g.s);
            const pct = Math.round(done/DOC_TYPES.length*100);
            const pend = g.docs.length;
            return `
            <div class="doc-group">
              <div class="doc-group-head">
                ${avatarHtml(g.s)}
                <div class="dgh-info">
                  <div class="dgh-name">${g.s.nombre}</div>
                  <div class="dgh-meta">${g.s.empresa||'Sin empresa asignada'} · ${pend} documento${pend===1?'':'s'} por completar</div>
                </div>
                <div class="doc-group-progress">
                  <span class="bar-label">${done}/${DOC_TYPES.length}</span>
                  <span class="bar-track"><span class="bar-fill" style="width:${pct}%"></span></span>
                </div>
                <button class="btn-secondary" data-action="open-student-docs" data-id="${g.s.id}">Ver expediente ${icon('arrow',13)}</button>
              </div>
            </div>`;
          }).join('')}
          </div>
        </div>`;
      }).join('') : `<div class="doc-empty-state">${icon('check',40)}<div style="font-weight:600;color:var(--navy);margin-bottom:2px">Todo al día</div><div class="hint">${(ef||sf)? 'No hay documentos que coincidan con el filtro seleccionado.' : 'No hay documentos pendientes, en revisión ni observados.'}</div></div>`}
    </div>
  </div>`;
  document.getElementById('view-root').innerHTML = html;
}

/* ============================================================
   RENDER: EVALUACIONES (global)
   ============================================================ */
function renderEvaluaciones(){
  const list = students();
  const escala = config().escalaAprobacion;

  const scoreChip = (label, val, iconName) => `
    <div class="eval-score-chip">
      <span class="esc-icon">${icon(iconName,14)}</span>
      <div class="esc-body">
        <div class="esc-label">${label}</div>
        <div class="esc-val">${val!==null && val!==undefined && val!==''? Number(val).toFixed(1) : '—'}</div>
      </div>
    </div>`;

  const evalCardHTML = s=>{
    const nota = (s.evaluacionEmpresa && s.evaluacionDocente)? weightedNota(s) : null;
    const aprobado = nota!==null ? nota>=escala : null;
    const resultadoPill = nota===null
      ? `<span class="pill" style="background:var(--amber-soft);color:var(--amber)">${icon('clock',12)}Pendiente</span>`
      : aprobado
        ? `<span class="pill" style="background:var(--green-soft);color:var(--green)">${icon('check',12)}Aprobado</span>`
        : `<span class="pill" style="background:var(--wine-soft);color:var(--wine)">${icon('alertTriangle',12)}Reprobado</span>`;
    return `
    <div class="eval-card">
      <div class="eval-card-head">
        ${avatarHtml(s)}
        <div class="va-info">
          <div class="va-name">${s.nombre}</div>
          <div class="va-meta">${s.empresa||'Sin empresa asignada'}</div>
        </div>
        ${resultadoPill}
      </div>
      <div class="eval-scores">
        ${scoreChip('Empresa', s.evaluacionEmpresa? s.evaluacionEmpresa.nota:null, 'award')}
        ${scoreChip('Docente', s.evaluacionDocente? s.evaluacionDocente.nota:null, 'userCheck')}
        ${scoreChip('Informe', (s.informeFinal && s.informeFinal.nota)? s.informeFinal.nota:null, 'fileCheck')}
      </div>
      <div class="eval-footer">
        <div class="eval-nota">
          <span class="en-label">Nota ponderada</span>
          <span class="en-val" style="color:${nota===null?'var(--slate-2)':aprobado?'var(--green)':'var(--wine)'}">${nota!==null?nota.toFixed(2):'—'}</span>
        </div>
        <button class="btn-secondary" data-action="open-student-tab" data-id="${s.id}" data-tab="evaluaciones">${nota!==null?'Completo':'Evaluar'} ${icon(nota!==null?'check':'arrow',13)}</button>
      </div>
    </div>`;
  };

  const carreraGroups = {};
  list.forEach(s=>{
    const carrera = s.carrera || 'Sin especialidad asignada';
    (carreraGroups[carrera] = carreraGroups[carrera] || []).push(s);
  });
  const carreraNames = Object.keys(carreraGroups).sort((a,b)=> carreraGroups[b].length - carreraGroups[a].length);

  const html = `
  <div class="panel">
    <div class="panel-head">
      <h2 style="display:flex;align-items:center;gap:9px"><span class="panel-head-icon">${icon('star',18)}</span>Estado de evaluaciones</h2>
      <span class="hint">${list.length} estudiante${list.length===1?'':'s'}</span>
    </div>
    <div class="panel-body">
      ${carreraNames.length ? carreraNames.map(carrera=>{
        const gList = carreraGroups[carrera];
        const key = 'evalesp_'+carrera.replace(/[^\w]+/g,'_');
        const collapsed = state.docCollapsed && state.docCollapsed[key];
        return `
        <div class="carrera-section">
          <div class="carrera-head" data-action="toggle-doc-carrera" data-key="${key}">
            <span class="chev ${collapsed?'collapsed':''}">${icon('chevronDown',15)}</span>
            <span class="carrera-icon">${icon('building',15)}</span>
            <span class="carrera-name">${carrera}</span>
            <span class="hint">${gList.length} estudiante${gList.length===1?'':'s'}</span>
          </div>
          <div class="carrera-body" style="${collapsed?'display:none':''}">
            <div class="eval-grid">${gList.map(evalCardHTML).join('')}</div>
          </div>
        </div>`;
      }).join('') : `<div class="empty-state">Aún no hay estudiantes registrados.</div>`}
    </div>
  </div>`;
  document.getElementById('view-root').innerHTML = html;
}

/* ---- Drill-down modal por indicador ---- */
function openStatDetail(metric){
  const list = students();
  let title='', bodyHtml='', chartConf=null;
  if(metric==='estudiantes'){
    title='Total de estudiantes por especialidad';
    const carreras = uniqueVals('carrera');
    chartConf = {type:'bar', data:{labels:carreras, datasets:[{label:'Estudiantes', data:carreras.map(c=>list.filter(s=>s.carrera===c).length), backgroundColor:'#16213E', borderRadius:4}]}};
  } else if(metric==='evaluacion'){
    title='Evaluación docente por estudiante';
    const withEval = list.filter(s=>s.evaluacionDocente);
    chartConf = {type:'bar', data:{labels:withEval.map(s=>s.nombre.split(' ')[0]), datasets:[{label:'Nota (1-7)', data:withEval.map(s=>s.evaluacionDocente.nota), backgroundColor:'#B7862B', borderRadius:4}]}, extra:{scales:{y:{beginAtZero:true, max:7}}}};
    if(!withEval.length) bodyHtml = '<div class="empty-state">Aún no hay evaluaciones docentes registradas.</div>';
  } else if(metric==='horas'){
    title='Horas de práctica por estudiante';
    chartConf = {type:'bar', data:{labels:list.map(s=>s.nombre.split(' ')[0]), datasets:[
      {label:'Requeridas', data:list.map(s=>s.horasRequeridas), backgroundColor:'#DDDFDA', borderRadius:4},
      {label:'Realizadas', data:list.map(s=>s.horasRealizadas), backgroundColor:'#16213E', borderRadius:4},
    ]}};
  } else if(metric==='finalizadas' || metric==='dash-finalizadas' || metric==='dash-pctfinal'){
    title = metric==='dash-pctfinal' ? 'Prácticas finalizadas (% del total)' : 'Prácticas finalizadas';
    const fin = list.filter(s=>s.estado==='Finalizada'||s.estado==='Cerrada');
    if(fin.length){
      bodyHtml = `<table><thead><tr><th>Estudiante</th><th>Especialidad</th><th>Empresa</th><th>Horas</th><th>Nota</th></tr></thead><tbody>
      ${fin.map(s=>`<tr><td class="row-clickable" data-action="open-student" data-id="${s.id}">${s.nombre}</td><td>${s.carrera||'—'}</td><td>${s.empresa||'—'}</td><td>${s.horasRealizadas}/${s.horasRequeridas}</td><td>${s.evaluacionDocente?s.evaluacionDocente.nota:'—'}</td></tr>`).join('')}
      </tbody></table>`;
    } else bodyHtml = '<div class="empty-state">Aún no hay prácticas finalizadas.</div>';
  } else if(metric==='dash-total'){
    title='Estudiantes en práctica por especialidad';
    const carreras = uniqueVals('carrera');
    chartConf = {type:'bar', data:{labels:carreras, datasets:[{label:'Estudiantes', data:carreras.map(c=>list.filter(s=>s.carrera===c).length), backgroundColor:'#16213E', borderRadius:4}]}};
  } else if(metric==='dash-horas'){
    title='Horas de práctica por estudiante';
    chartConf = {type:'bar', data:{labels:list.map(s=>s.nombre.split(' ')[0]), datasets:[
      {label:'Requeridas', data:list.map(s=>s.horasRequeridas), backgroundColor:'#DDDFDA', borderRadius:4},
      {label:'Realizadas', data:list.map(s=>s.horasRealizadas), backgroundColor:'#16213E', borderRadius:4},
    ]}};
  } else if(metric==='dash-activas'){
    title='Prácticas activas';
    const act = list.filter(s=>s.estado==='En ejecución');
    bodyHtml = act.length ? `<table><thead><tr><th>Estudiante</th><th>Especialidad</th><th>Empresa</th><th>Inicio</th><th>Término</th></tr></thead><tbody>
      ${act.map(s=>`<tr><td class="row-clickable" data-action="open-student" data-id="${s.id}">${s.nombre}</td><td>${s.carrera||'—'}</td><td>${s.empresa||'—'}</td><td>${s.fechaInicio||'—'}</td><td>${s.fechaTermino||'—'}</td></tr>`).join('')}
      </tbody></table>` : '<div class="empty-state">No hay prácticas activas en este momento.</div>';
  } else if(metric==='dash-pendientes'){
    title='Pendientes de inicio';
    const pend = list.filter(s=>s.estado==='Pendiente'||s.estado==='Próxima a iniciar');
    bodyHtml = pend.length ? `<table><thead><tr><th>Estudiante</th><th>Especialidad</th><th>Empresa</th><th>Inicio previsto</th></tr></thead><tbody>
      ${pend.map(s=>`<tr><td class="row-clickable" data-action="open-student" data-id="${s.id}">${s.nombre}</td><td>${s.carrera||'—'}</td><td>${s.empresa||'Sin empresa asignada'}</td><td>${s.fechaInicio||'—'}</td></tr>`).join('')}
      </tbody></table>` : '<div class="empty-state">No hay estudiantes pendientes de inicio.</div>';
  } else if(metric==='dash-proxfin'){
    title='Próximas a finalizar (15 días)';
    const prox = list.filter(s=>{ if(!s.fechaTermino) return false; const d=(new Date(s.fechaTermino)-new Date())/86400000; return d>0 && d<15 && s.estado!=='Finalizada' && s.estado!=='Cerrada'; });
    bodyHtml = prox.length ? `<table><thead><tr><th>Estudiante</th><th>Empresa</th><th>Término</th><th>Días restantes</th></tr></thead><tbody>
      ${prox.map(s=>{ const d=Math.ceil((new Date(s.fechaTermino)-new Date())/86400000); return `<tr><td class="row-clickable" data-action="open-student" data-id="${s.id}">${s.nombre}</td><td>${s.empresa||'—'}</td><td>${s.fechaTermino}</td><td>${d} día${d===1?'':'s'}</td></tr>`; }).join('')}
      </tbody></table>` : '<div class="empty-state">No hay prácticas por finalizar en los próximos 15 días.</div>';
  } else if(metric==='dash-docspend'){
    title='Documentos pendientes por estudiante';
    const withPend = list.map(s=>({s, faltan: DOC_TYPES.filter(d=>s.documentos[d.key].status!=='completo')})).filter(x=>x.faltan.length);
    bodyHtml = withPend.length ? `<table><thead><tr><th>Estudiante</th><th>Empresa</th><th>Documentos pendientes</th></tr></thead><tbody>
      ${withPend.map(x=>`<tr><td class="row-clickable" data-action="open-student" data-id="${x.s.id}">${x.s.nombre}</td><td>${x.s.empresa||'—'}</td><td>${x.faltan.length}/${DOC_TYPES.length} — ${x.faltan.map(d=>d.name).join(', ')}</td></tr>`).join('')}
      </tbody></table>` : '<div class="empty-state">No hay documentos pendientes.</div>';
  } else if(metric==='dash-docsobs'){
    title='Documentos observados';
    const withObs = list.map(s=>({s, obs: DOC_TYPES.filter(d=>s.documentos[d.key].status==='observado')})).filter(x=>x.obs.length);
    bodyHtml = withObs.length ? `<table><thead><tr><th>Estudiante</th><th>Empresa</th><th>Documentos observados</th></tr></thead><tbody>
      ${withObs.map(x=>`<tr><td class="row-clickable" data-action="open-student" data-id="${x.s.id}">${x.s.nombre}</td><td>${x.s.empresa||'—'}</td><td>${x.obs.map(d=>d.name).join(', ')}</td></tr>`).join('')}
      </tbody></table>` : '<div class="empty-state">No hay documentos observados.</div>';
  } else if(metric==='dash-evalpend'){
    title='Evaluaciones pendientes';
    const pend = list.filter(s=>!s.evaluacionEmpresa || !s.evaluacionDocente);
    bodyHtml = pend.length ? `<table><thead><tr><th>Estudiante</th><th>Empresa</th><th>Eval. empresa</th><th>Eval. docente</th></tr></thead><tbody>
      ${pend.map(s=>`<tr><td class="row-clickable" data-action="open-student" data-id="${s.id}">${s.nombre}</td><td>${s.empresa||'—'}</td><td>${s.evaluacionEmpresa?'Completa':'Pendiente'}</td><td>${s.evaluacionDocente?'Completa':'Pendiente'}</td></tr>`).join('')}
      </tbody></table>` : '<div class="empty-state">No hay evaluaciones pendientes.</div>';
  }
  document.getElementById('modal-root').innerHTML = `
  <div class="modal-overlay" data-action="close-modal">
    <div class="modal" style="max-width:640px" data-action="noop">
      <div class="modal-head"><h2>${title}</h2><button class="close-x" data-action="close-modal">&times;</button></div>
      <div class="modal-body">
        ${chartConf ? '<div style="height:320px;position:relative"><canvas id="chartDetail"></canvas></div>' : ''}
        ${bodyHtml}
      </div>
      <div class="modal-foot"><button class="btn-secondary" data-action="close-modal">Cerrar</button></div>
    </div>
  </div>`;
  if(chartConf){ makeChart('chartDetail', chartConf.type, chartConf.data, chartConf.extra); }
}

function tplDocumentos(s){
  const complete = isChecklistComplete(s);
  const romanos = ['I','II','III','IV','V','VI'];
  let openAssigned = false;
  return `
  ${complete? `<div class="banner-complete">${icon('check',18)} <span style="flex:1">EXPEDIENTE COMPLETO — toda la documentación fue cargada.</span></div>`:''}
  <div class="doc-phases">
    ${DOC_FASES.map((fase,i)=>{
      const docs = DOC_TYPES.filter(d=> d.n>=fase.range[0] && d.n<=fase.range[1]);
      const done = docs.filter(d=> s.documentos[d.key].status==='completo').length;
      const faseComplete = done===docs.length;
      let openHere = false;
      if(!complete && !openAssigned && !faseComplete){ openHere = true; openAssigned = true; }
      return `<details class="doc-phase" ${openHere?'open':''}>
        <summary>
          <div class="phase-head-left">
            <div class="phase-num">${romanos[i]}</div>
            <div class="phase-titles">
              <h4>${fase.label}</h4>
              <p>${fase.hint}</p>
            </div>
          </div>
          <div class="phase-head-right">
            <span class="phase-count${faseComplete?' complete':''}">${done} / ${docs.length}</span>
            <span class="phase-chevron">${icon('arrow',14)}</span>
          </div>
        </summary>
        <div class="doc-ledger">
          ${docs.map(d=>docRowHTML(s,d)).join('')}
        </div>
      </details>`;
    }).join('')}
  </div>
  <div style="margin-top:16px;display:flex;gap:10px;flex-wrap:wrap">
    <button class="btn-secondary" data-action="download-expediente" data-id="${s.id}">${icon('download',14)} Generar expediente completo (PDF)</button>
    <button class="btn-primary gold" data-action="generate-all-docs" data-id="${s.id}">${icon('file',15)} Regenerar todos los documentos</button>
  </div>`;
}

function tplCierre(s){
  const checks = [
    ['Documentación completa (12/12)', isChecklistComplete(s)],
    ['Horas requeridas cumplidas', s.horasRealizadas>=s.horasRequeridas],
    ['Evaluación empresa realizada', !!s.evaluacionEmpresa],
    ['Evaluación docente realizada', !!s.evaluacionDocente],
    ['Informe final cargado', !!(s.informeFinal && s.informeFinal.nota)],
  ];
  const allOk = checks.every(c=>c[1]);
  return `
  <div class="form-section">
    <div class="st"><div class="bar"></div><h4>Validación de cierre</h4></div>
    <ul class="small-list">
      ${checks.map(c=>`<li><span>${c[0]}</span>${c[1]? docStatusPill('completo') : docStatusPill('pendiente')}</li>`).join('')}
    </ul>
  </div>
  ${s.estado==='Cerrada'? `
    <div class="banner-complete">${icon('check',18)} Práctica finalizada el ${fmtDate(s.fechaCierre)}.</div>
    <button class="btn-secondary" data-action="download-expediente" data-id="${s.id}">${icon('download',14)} Descargar expediente final</button>
  `:`
    <button class="btn-primary gold" ${allOk?'':'disabled style="opacity:.45;cursor:not-allowed"'} data-action="finalize-practice" data-id="${s.id}">${icon('check',15)} Finalizar práctica</button>
    ${!allOk? '<div class="hint" style="margin-top:8px">Completa todos los puntos anteriores para habilitar el cierre.</div>':''}
  `}
  `;
}
